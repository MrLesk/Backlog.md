name: Release multi-platform executables

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      prepared_commit:
        description: Prepared release commit
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  NODE_OPTIONS: --use-openssl-ca
  NODE_USE_SYSTEM_CA: '0'
  BUN_VERSION: 1.4.4

jobs:
  prepare-release:
    if: github.event_name == 'push' && github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - &secure-tls
        name: Exclude compromised certificate trust before networking
        shell: bash
        run: |
          node <<'NODE'
          // Prepare filtered trust for subsequent network steps.
          const fs = require('node:fs');
          const path = require('node:path');
          const tls = require('node:tls');
          const { X509Certificate, createHash } = require('node:crypto');
          const blocked = new Set(["0a6c2b2ca5b364207954171987ac9d2178561569d8205457e77ca90c32ede282", "43bffa19d6ef651451f6841e019931e96f6f2eaeff28ab4b6f1ce4576de2717b", "49dd353dc2b919a3770645117d0e60c16115e7d1bc259eefe734b00ea434fe5f", "5c0660a2b164910d8ff589c18e14552e9e0ec237dcefe2cb736d41a4811f81a0", "63ecefee431d49523bc1136c4e72d0206a477086caf606cd5cf025686c109cf8", "8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782", "92c063d67e8f14db71d288e11266ffdaf69cbf115f7bab14f3bc2f68d25e0e30", "bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3", "c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9", "e0254c7fcdc265e2f0f8a428dabb75ab4ae039b4872d62f5ee57f0877d5a8a41", "ebed6475c2c2d80fcb199f3fe8dd6e6b3ce60b77eb15d4e42c3dec0c6f5b5105", "ec4ffa1ad0ac88081314b7aaffef6a91f97cd57291bb5ba686c5415f5eb4f6b6"]);
          if (Object.keys(process.env).some(key => key.toUpperCase() === 'GIT_SSL_NO_VERIFY' && process.env[key] !== undefined)) {
            throw new Error('Remove GIT_SSL_NO_VERIFY from the runner or workflow environment before continuing.');
          }
          const sources = [...tls.rootCertificates];
          if (tls.getCACertificates) {
            for (const source of ['default', 'system', 'extra']) sources.push(...tls.getCACertificates(source));
          }
          const certificates = new Map();
          for (const pem of sources) {
            const certificate = new X509Certificate(pem);
            const key = createHash('sha256').update(certificate.publicKey.export({ type: 'spki', format: 'der' })).digest('hex');
            if (!blocked.has(key)) certificates.set(certificate.fingerprint256, pem);
          }
          if (!certificates.size) throw new Error('Refusing an empty TLS trust bundle');
          const file = path.join(process.env.RUNNER_TEMP, 'backlog-trusted-ca.pem');
          const directory = path.join(process.env.RUNNER_TEMP, 'backlog-empty-ca-directory');
          fs.writeFileSync(file, [...certificates.values()].join('\n') + '\n');
          fs.mkdirSync(directory, { recursive: true });
          // Git cannot isolate HTTPS-proxy CA directories; block that transport.
          const proxyDirectory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'backlog-proxy-trust-'));
          const proxyMarker = path.join(proxyDirectory, 'unsupported-https-proxy');
          fs.writeFileSync(proxyMarker, '', { mode: 0o600 });
          const proxyCAFile = path.join(proxyMarker, 'unavailable.pem');
          const settings = {
            SSL_CERT_FILE: file, SSL_CERT_DIR: directory, NODE_EXTRA_CA_CERTS: file,
            NODE_USE_SYSTEM_CA: '0', NODE_TLS_REJECT_UNAUTHORIZED: '1', GIT_SSL_CAINFO: file, GIT_SSL_CAPATH: directory, CURL_CA_BUNDLE: file,
            GIT_PROXY_SSL_CAINFO: proxyCAFile, CARGO_HTTP_CAINFO: file, NPM_CONFIG_CAFILE: file, NIX_SSL_CERT_FILE: file,
          };
          const repository = new URL(`${process.env.GITHUB_SERVER_URL.replace(/\/+$/, '')}/${process.env.GITHUB_REPOSITORY}`);
          if (repository.protocol !== 'https:' || repository.username || repository.password) throw new Error('Expected a credential-free HTTPS GitHub server.');
          const git = [['http.schannelUseSSLCAInfo', 'true']];
          for (const url of [repository.href, `${repository.href}.git`]) {
            git.push([`http.${url}.sslVerify`, 'true'], [`http.${url}.schannelUseSSLCAInfo`, 'true']);
          }
          const rawCount = process.env.GIT_CONFIG_COUNT ?? '0';
          const gitCount = Number(rawCount);
          if (!/^(0|[1-9][0-9]*)$/.test(rawCount) || !Number.isSafeInteger(gitCount + git.length)) throw new Error('Invalid GIT_CONFIG_COUNT');
          for (const [offset, [key, value]] of git.entries()) {
            settings[`GIT_CONFIG_KEY_${gitCount + offset}`] = key;
            settings[`GIT_CONFIG_VALUE_${gitCount + offset}`] = value;
          }
          settings.GIT_CONFIG_COUNT = String(gitCount + git.length);
          const quote = value => "'" + value.replaceAll("'", "'\\''") + "'";
          settings.GIT_CONFIG_PARAMETERS = [process.env.GIT_CONFIG_PARAMETERS,
            ...git.map(([key, value]) => quote(key) + '=' + quote(value))].filter(Boolean).join(' ');
          for (const [key, value] of Object.entries(settings)) {
            if (/[\r\n]/.test(value)) throw new Error('TLS environment values must not contain newlines.');
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          console.log(`Prepared ${certificates.size} trusted CAs with eMudhra incident keys excluded`);
          NODE
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Prepare tagged source and start release
        shell: bash
        env:
          EXPECTED_TAG_OBJECT: ${{ github.event.after }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF"
          TAG_OBJECT="$(git rev-parse FETCH_HEAD)"
          TAG_COMMIT="$(git rev-parse 'FETCH_HEAD^{commit}')"

          git checkout --detach "$GITHUB_SHA"
          TAG="${GITHUB_REF#refs/tags/v}"
          jq --arg version "$TAG" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          git add package.json
          EXPECTED_TREE="$(git write-tree)"
          COMMIT_MESSAGE="$(printf 'chore: prepare %s source version [skip ci]\n\nBacklog-Release-Run: %s' \
            "$GITHUB_REF_NAME" "$GITHUB_RUN_ID")"
          if [[ "$TAG_OBJECT" == "$EXPECTED_TAG_OBJECT" && "$TAG_COMMIT" == "$GITHUB_SHA" ]]; then
            if ! git diff --cached --quiet -- package.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "$COMMIT_MESSAGE"
              git push --force-with-lease="$GITHUB_REF:$EXPECTED_TAG_OBJECT" origin "HEAD:$GITHUB_REF"
            fi
            PREPARED_COMMIT="$(git rev-parse HEAD)"
          elif ! git diff --cached --quiet -- package.json && \
               [[ "$TAG_OBJECT" == "$TAG_COMMIT" && \
                  "$(git show -s --format=%P "$TAG_COMMIT")" == "$GITHUB_SHA" && \
                  "$(git rev-parse "$TAG_COMMIT^{tree}")" == "$EXPECTED_TREE" && \
                  "$(git show -s --format=%B "$TAG_COMMIT")" == "$COMMIT_MESSAGE" ]]; then
            # Retry only this run's existing version-only commit after a failed dispatch.
            PREPARED_COMMIT="$TAG_COMMIT"
          else
            echo "Release tag changed outside this run's preparation; refusing to continue." >&2
            exit 1
          fi

          # A new run gives npm provenance the same commit as the prepared source.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f "prepared_commit=$PREPARED_COMMIT"

  verify-source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - *secure-tls
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify prepared release source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.prepared_commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v*.*.* || "$GITHUB_SHA" != "$EXPECTED_COMMIT" ]]; then
            echo "Release must run at the expected prepared tag commit." >&2
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(jq -r .version package.json)" = "${GITHUB_REF#refs/tags/v}"

  build:
    needs: verify-source
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
          - os: ubuntu-latest
            target: bun-windows-arm64
    runs-on: ${{ matrix.os }}
    env:
      BIN: backlog-bin${{ contains(matrix.target,'windows') && '.exe' || '' }}
    steps:
      - *secure-tls
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - name: Install checksum-verified Bun
        run: node scripts/prepare-bun-runtime.cjs
      - uses: actions/cache@v6.1.0
        id: cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.target }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-bun-${{ env.BUN_VERSION }}-
      - shell: bash
        run: bun install --cafile "$SSL_CERT_FILE" --frozen-lockfile
      - name: Prepare checksum-verified target runtime
        shell: bash
        run: node scripts/prepare-bun-runtime.cjs "${{ matrix.target }}"
      - name: Compile standalone binary
        shell: bash
        run: |
          mkdir -p dist
          BACKLOG_BUILD_VERSION="${GITHUB_REF##refs/tags/v}" \
            BACKLOG_BUILD_TARGET="${{ matrix.target }}" \
            BACKLOG_BUILD_OUTFILE="dist/${{ env.BIN }}" \
            bun scripts/build.ts
      - name: Make binary executable (non-Windows)
        if: ${{ !contains(matrix.target,'windows') }}
        run: chmod +x "dist/${{ env.BIN }}"
      - name: Check build output and move binary
        shell: bash
        run: |
          echo "Contents of dist/:"
          ls -la dist/
          echo "Moving dist/${{ env.BIN }} to ${{ env.BIN }}"
          mv dist/${{ env.BIN }} ${{ env.BIN }}
          echo "Final binary size:"
          ls -lh ${{ env.BIN }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: backlog-${{ matrix.target }}
          path: ${{ env.BIN }}

  npm-publish:
    needs: [build, verify-platform-packages]
    runs-on: ubuntu-latest
    steps:
      - *secure-tls
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Prepare npm package
        shell: bash
        run: |
          mkdir -p dist
          cp scripts/cli.cjs dist/cli.js
          cp scripts/resolveBinary.cjs dist/resolveBinary.cjs
          cp scripts/postuninstall.cjs dist/postuninstall.cjs
          chmod +x dist/cli.js
      - name: Create npm-ready package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          jq 'del(.devDependencies,.patchedDependencies,.overrides,.scripts.prepare,.scripts.preinstall,.type) |
              .version = "'$TAG'" |
              .bin = {backlog:"cli.js"} |
              .files = ["cli.js","resolveBinary.cjs","postuninstall.cjs","package.json","README.md","LICENSE"] |
              .scripts = {"postuninstall": "node postuninstall.cjs"} |
              .repository = {"type":"git","url":"https://github.com/MrLesk/Backlog.md"} |
              .optionalDependencies |= map_values("'$TAG'")' package.json > dist/package.json
          cp LICENSE README.md dist/ 2>/dev/null || true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - name: Configure npm for trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@12.2.1
          npm --version
      - name: Dry run trusted publish
        run: |
          cd dist
          npm publish --access public --dry-run
      - name: Publish to npm
        run: |
          cd dist
          npm publish --access public

  publish-binaries:
    needs: build
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            package: backlog.md-linux-x64
            os: linux
            cpu: x64
          - target: bun-linux-arm64
            package: backlog.md-linux-arm64
            os: linux
            cpu: arm64
          - target: bun-darwin-x64
            package: backlog.md-darwin-x64
            os: darwin
            cpu: x64
          - target: bun-darwin-arm64
            package: backlog.md-darwin-arm64
            os: darwin
            cpu: arm64
          - target: bun-windows-x64
            package: backlog.md-windows-x64
            os: win32
            cpu: x64
          - target: bun-windows-arm64
            package: backlog.md-windows-arm64
            os: win32
            cpu: arm64
    runs-on: ubuntu-latest
    steps:
      - *secure-tls
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download platform binary
        id: binary
        background: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: backlog-${{ matrix.target }}
        timeout-minutes: 15
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - name: Configure npm for trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@12.2.1
          npm --version
      - name: Wait for platform binary
        wait: binary
      - name: Prepare package
        shell: bash
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          mkdir -p pkg
          # Rename the binary to the expected name
          if [[ -f backlog-bin.exe ]]; then
            mv backlog-bin.exe pkg/backlog.exe
          elif [[ -f backlog-bin ]]; then
            mv backlog-bin pkg/backlog
          else
            echo "Error: No binary found"
            ls -la
            exit 1
          fi
          cp LICENSE README.md pkg/ 2>/dev/null || true
          cat <<EOF > pkg/package.json
          {
            "name": "${{ matrix.package }}",
            "version": "${TAG}",
            "os": ["${{ matrix.os }}"],
            "cpu": ["${{ matrix.cpu }}"],
            "files": ["backlog${{ contains(matrix.target,'windows') && '.exe' || '' }}","package.json","LICENSE"],
            "repository": {
              "type": "git",
              "url": "https://github.com/MrLesk/Backlog.md"
            }
          }
          EOF
      - name: Ensure executable permission (non-Windows)
        if: ${{ !contains(matrix.target,'windows') }}
        shell: bash
        run: |
          chmod +x pkg/backlog
      - name: Dry run platform publish
        run: |
          cd pkg
          npm publish --access public --dry-run
      - name: Publish platform package
        run: |
          cd pkg
          npm publish --access public

  verify-platform-packages:
    name: verify-platform-packages-${{ matrix.os }}
    needs: publish-binaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - *secure-tls
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
          registry-url: https://registry.npmjs.org
      - name: Use current npm
        shell: bash
        run: npm install -g npm@12.2.1
      - name: Wait for platform package installability (Unix)
        background: true
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF##refs/tags/v}"
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          PACKAGE_NAME="$(node -e 'const map = { win32: "windows", darwin: "darwin", linux: "linux" }; const platform = map[process.platform]; const arch = process.arch; if (!platform || !["x64","arm64"].includes(arch)) { process.exit(1); } process.stdout.write(`backlog.md-${platform}-${arch}`);')"
          BINARY_PATH="node_modules/${PACKAGE_NAME}/backlog"

          echo "Waiting for ${PACKAGE_NAME}@${VERSION} to become installable..."
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            rm -rf sanity
            mkdir sanity
            cd sanity
            npm init -y >/dev/null 2>&1

            if npm i "${PACKAGE_NAME}@${VERSION}" --prefer-online --no-audit --no-fund; then
              if [[ -f "$BINARY_PATH" ]]; then
                if "./$BINARY_PATH" -v; then
                  echo "Resolved ${PACKAGE_NAME}@${VERSION} on attempt ${attempt}/${MAX_ATTEMPTS}."
                  exit 0
                fi
              fi
            fi

            echo "Attempt ${attempt}/${MAX_ATTEMPTS} failed for ${PACKAGE_NAME}@${VERSION}."
            npm ls --depth=1 || true
            ls -la node_modules || true
            cd ..

            if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Timed out waiting for ${PACKAGE_NAME}@${VERSION}."
          exit 1
      - name: Wait for all platform package metadata (Linux only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF##refs/tags/v}"
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          PACKAGES=(
            "backlog.md-linux-x64"
            "backlog.md-linux-arm64"
            "backlog.md-darwin-x64"
            "backlog.md-darwin-arm64"
            "backlog.md-windows-x64"
            "backlog.md-windows-arm64"
          )

          for pkg in "${PACKAGES[@]}"; do
            resolved=0
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              version="$(npm view "${pkg}@${VERSION}" version 2>/dev/null || true)"
              if [[ "$version" == "$VERSION" ]]; then
                echo "Metadata visible: ${pkg}@${VERSION} (attempt ${attempt}/${MAX_ATTEMPTS})."
                resolved=1
                break
              fi

              echo "Attempt ${attempt}/${MAX_ATTEMPTS} metadata miss for ${pkg}@${VERSION}."
              if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
                sleep "$SLEEP_SECONDS"
              fi
            done

            if [[ "$resolved" -ne 1 ]]; then
              echo "Timed out waiting for metadata: ${pkg}@${VERSION}."
              exit 1
            fi
          done
      - name: Wait for platform package installability (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Version = $env:GITHUB_REF_NAME.TrimStart("v")
          $MaxAttempts = 40
          $SleepSeconds = 15
          $Arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($Arch -ne "x64" -and $Arch -ne "arm64") {
            throw "Unsupported runner arch: $Arch"
          }

          $PackageName = "backlog.md-windows-$Arch"
          $BinaryPath = Join-Path -Path "node_modules/$PackageName" -ChildPath "backlog.exe"

          Write-Host "Waiting for $PackageName@$Version to become installable..."
          for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
            if (Test-Path "sanity") {
              Remove-Item -Recurse -Force "sanity"
            }
            New-Item -ItemType Directory -Path "sanity" | Out-Null
            Push-Location "sanity"

            try {
              npm init -y | Out-Null
              npm i "$PackageName@$Version" --prefer-online --no-audit --no-fund
              if ($LASTEXITCODE -eq 0 -and (Test-Path $BinaryPath)) {
                & $BinaryPath -v
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "Resolved $PackageName@$Version on attempt $attempt/$MaxAttempts."
                  exit 0
                }
              }

              Write-Host "Attempt $attempt/$MaxAttempts failed for $PackageName@$Version."
              npm ls --depth=1 | Out-Host
              if (Test-Path node_modules) {
                Get-ChildItem node_modules | Out-Host
              }
            } finally {
              Pop-Location
            }

            if ($attempt -lt $MaxAttempts) {
              Start-Sleep -Seconds $SleepSeconds
            }
          }

          throw "Timed out waiting for $PackageName@$Version."
      - name: Wait for platform package checks
        wait-all:

  install-sanity:
    name: install-sanity-${{ matrix.os }}
    needs: [publish-binaries, npm-publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - *secure-tls
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
          registry-url: https://registry.npmjs.org
      - name: Install and run backlog -v (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF##refs/tags/v}"
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          EXPECTED_PACKAGE="$(node -e 'const map = { win32: "windows", darwin: "darwin", linux: "linux" }; const platform = map[process.platform]; const arch = process.arch; if (!platform || !["x64","arm64"].includes(arch)) { process.exit(1); } process.stdout.write(`backlog.md-${platform}-${arch}`);')"
          echo "Waiting for backlog.md@${VERSION} install + ${EXPECTED_PACKAGE} optional dependency..."

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            rm -rf sanity
            mkdir sanity
            cd sanity
            npm init -y >/dev/null 2>&1

            if npm i "backlog.md@${VERSION}" --prefer-online --no-audit --no-fund; then
              if npx backlog -v; then
                echo "Install sanity succeeded on attempt ${attempt}/${MAX_ATTEMPTS}."
                exit 0
              fi
            fi

            echo "Attempt ${attempt}/${MAX_ATTEMPTS} failed."
            echo "Expected optional package: ${EXPECTED_PACKAGE}"
            npm ls --depth=1 || true
            if [[ -d "node_modules/${EXPECTED_PACKAGE}" ]]; then
              echo "Optional package directory exists: node_modules/${EXPECTED_PACKAGE}"
            else
              echo "Optional package directory missing: node_modules/${EXPECTED_PACKAGE}"
            fi
            cd ..

            if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Install sanity timed out for backlog.md@${VERSION}."
          exit 1
      - name: Install and run backlog -v (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Version = $env:GITHUB_REF_NAME.TrimStart("v")
          $MaxAttempts = 40
          $SleepSeconds = 15
          $Arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($Arch -ne "x64" -and $Arch -ne "arm64") {
            throw "Unsupported runner arch: $Arch"
          }

          $ExpectedPackage = "backlog.md-windows-$Arch"
          Write-Host "Waiting for backlog.md@$Version install + $ExpectedPackage optional dependency..."

          for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
            if (Test-Path "sanity") {
              Remove-Item -Recurse -Force "sanity"
            }
            New-Item -ItemType Directory -Path "sanity" | Out-Null
            Push-Location "sanity"

            try {
              npm init -y | Out-Null
              npm i "backlog.md@$Version" --prefer-online --no-audit --no-fund
              if ($LASTEXITCODE -eq 0) {
                npx backlog -v
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "Install sanity succeeded on attempt $attempt/$MaxAttempts."
                  exit 0
                }
              }

              Write-Host "Attempt $attempt/$MaxAttempts failed."
              Write-Host "Expected optional package: $ExpectedPackage"
              npm ls --depth=1 | Out-Host
              if (Test-Path "node_modules/$ExpectedPackage") {
                Write-Host "Optional package directory exists: node_modules/$ExpectedPackage"
              } else {
                Write-Host "Optional package directory missing: node_modules/$ExpectedPackage"
              }
            } finally {
              Pop-Location
            }

            if ($attempt -lt $MaxAttempts) {
              Start-Sleep -Seconds $SleepSeconds
            }
          }

          throw "Install sanity timed out for backlog.md@$Version."

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - *secure-tls
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
        timeout-minutes: 15
      - name: Rename binaries for release
        run: |
          echo "=== Debug: Downloaded artifacts ==="
          find release-assets -type f -exec ls -lh {} \;
          echo "=== Processing artifacts ==="
          mkdir -p binaries
          for dir in release-assets/*/; do
            if [ -d "$dir" ]; then
              target=$(basename "$dir" | sed 's/backlog-//')
              echo "Processing target: $target"
              echo "Directory contents:"
              ls -la "$dir"
              binary=$(find "$dir" -name "backlog-bin*" -type f)
              if [ -n "$binary" ]; then
                echo "Found binary: $binary ($(ls -lh "$binary" | awk '{print $5}'))"
                if [[ "$target" == *"windows"* ]] && [[ "$binary" == *".exe" ]]; then
                  cp "$binary" "binaries/backlog-${target}.exe"
                  echo "Copied to binaries/backlog-${target}.exe ($(ls -lh "binaries/backlog-${target}.exe" | awk '{print $5}'))"
                else
                  cp "$binary" "binaries/backlog-${target}"
                  echo "Copied to binaries/backlog-${target} ($(ls -lh "binaries/backlog-${target}" | awk '{print $5}'))"
                fi
              fi
            fi
          done
          echo "=== Final binaries ==="
          ls -lh binaries/
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: binaries/*

  sync-version:
    needs: [github-release, npm-publish, install-sanity]
    runs-on: ubuntu-latest
    steps:
      - *secure-tls
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Sync version to tag
        shell: bash
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          jq ".version = \"$TAG\"" package.json > tmp.json && mv tmp.json package.json
      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "chore: sync package.json version to ${{ github.ref_name }} [skip ci]"
          branch: main
          file_pattern: package.json
