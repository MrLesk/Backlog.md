name: Groma architecture

# Publishes Backlog.md's groma.md architecture map to GitHub Pages, with a before/after comparison for
# every open pull request, and keeps one comment on each pull request linking to its comparison.
# The same setup as the groma.md repository's own architecture workflow, on the released Action.
#
#   /architecture/auto/          the current map of main
#   /comparison/pr-<n>/auto/     what pull request <n> changes in the architecture
#
# Needs Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  # Runs main's copy of this workflow. Pull request code is only read, never executed.
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Reviewed PR number to include (0 compares same-repository PRs only)
        type: number
        default: 0

permissions:
  contents: read
  pages: read

env:
  NODE_OPTIONS: --use-openssl-ca
  NODE_USE_SYSTEM_CA: '0'
  GROMA_THEME: auto

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Each deploy replaces the site, so every run rebuilds the map and all open comparisons.
  # Fork comparisons need a reviewed PR number for this run.
  pulls:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      open: ${{ steps.open.outputs.pulls }}
    steps:
      - &secure-tls
        name: Exclude compromised certificate trust before networking
        shell: bash
        run: |
          node <<'NODE'
          // Prepare filtered trust for subsequent network steps.
          const fs = require('node:fs');
          const path = require('node:path');
          const tls = require('node:tls');
          const { X509Certificate, createHash } = require('node:crypto');
          const blocked = new Set(["0a6c2b2ca5b364207954171987ac9d2178561569d8205457e77ca90c32ede282", "43bffa19d6ef651451f6841e019931e96f6f2eaeff28ab4b6f1ce4576de2717b", "49dd353dc2b919a3770645117d0e60c16115e7d1bc259eefe734b00ea434fe5f", "5c0660a2b164910d8ff589c18e14552e9e0ec237dcefe2cb736d41a4811f81a0", "63ecefee431d49523bc1136c4e72d0206a477086caf606cd5cf025686c109cf8", "8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782", "92c063d67e8f14db71d288e11266ffdaf69cbf115f7bab14f3bc2f68d25e0e30", "bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3", "c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9", "e0254c7fcdc265e2f0f8a428dabb75ab4ae039b4872d62f5ee57f0877d5a8a41", "ebed6475c2c2d80fcb199f3fe8dd6e6b3ce60b77eb15d4e42c3dec0c6f5b5105", "ec4ffa1ad0ac88081314b7aaffef6a91f97cd57291bb5ba686c5415f5eb4f6b6"]);
          if (Object.keys(process.env).some(key => key.toUpperCase() === 'GIT_SSL_NO_VERIFY' && process.env[key] !== undefined)) {
            throw new Error('Remove GIT_SSL_NO_VERIFY from the runner or workflow environment before continuing.');
          }
          const sources = [...tls.rootCertificates];
          if (tls.getCACertificates) {
            for (const source of ['default', 'system', 'extra']) sources.push(...tls.getCACertificates(source));
          }
          const certificates = new Map();
          for (const pem of sources) {
            const certificate = new X509Certificate(pem);
            const key = createHash('sha256').update(certificate.publicKey.export({ type: 'spki', format: 'der' })).digest('hex');
            if (!blocked.has(key)) certificates.set(certificate.fingerprint256, pem);
          }
          if (!certificates.size) throw new Error('Refusing an empty TLS trust bundle');
          const file = path.join(process.env.RUNNER_TEMP, 'backlog-trusted-ca.pem');
          const directory = path.join(process.env.RUNNER_TEMP, 'backlog-empty-ca-directory');
          fs.writeFileSync(file, [...certificates.values()].join('\n') + '\n');
          fs.mkdirSync(directory, { recursive: true });
          // Git cannot isolate HTTPS-proxy CA directories; block that transport.
          const proxyDirectory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'backlog-proxy-trust-'));
          const proxyMarker = path.join(proxyDirectory, 'unsupported-https-proxy');
          fs.writeFileSync(proxyMarker, '', { mode: 0o600 });
          const proxyCAFile = path.join(proxyMarker, 'unavailable.pem');
          const settings = {
            SSL_CERT_FILE: file, SSL_CERT_DIR: directory, NODE_EXTRA_CA_CERTS: file,
            NODE_USE_SYSTEM_CA: '0', NODE_TLS_REJECT_UNAUTHORIZED: '1', GIT_SSL_CAINFO: file, GIT_SSL_CAPATH: directory, CURL_CA_BUNDLE: file,
            GIT_PROXY_SSL_CAINFO: proxyCAFile, CARGO_HTTP_CAINFO: file, NPM_CONFIG_CAFILE: file, NIX_SSL_CERT_FILE: file,
          };
          const repository = new URL(`${process.env.GITHUB_SERVER_URL.replace(/\/+$/, '')}/${process.env.GITHUB_REPOSITORY}`);
          if (repository.protocol !== 'https:' || repository.username || repository.password) throw new Error('Expected a credential-free HTTPS GitHub server.');
          const git = [['http.schannelUseSSLCAInfo', 'true']];
          for (const url of [repository.href, `${repository.href}.git`]) {
            git.push([`http.${url}.sslVerify`, 'true'], [`http.${url}.schannelUseSSLCAInfo`, 'true']);
          }
          const rawCount = process.env.GIT_CONFIG_COUNT ?? '0';
          const gitCount = Number(rawCount);
          if (!/^(0|[1-9][0-9]*)$/.test(rawCount) || !Number.isSafeInteger(gitCount + git.length)) throw new Error('Invalid GIT_CONFIG_COUNT');
          for (const [offset, [key, value]] of git.entries()) {
            settings[`GIT_CONFIG_KEY_${gitCount + offset}`] = key;
            settings[`GIT_CONFIG_VALUE_${gitCount + offset}`] = value;
          }
          settings.GIT_CONFIG_COUNT = String(gitCount + git.length);
          const quote = value => "'" + value.replaceAll("'", "'\\''") + "'";
          settings.GIT_CONFIG_PARAMETERS = [process.env.GIT_CONFIG_PARAMETERS,
            ...git.map(([key, value]) => quote(key) + '=' + quote(value))].filter(Boolean).join(' ');
          for (const [key, value] of Object.entries(settings)) {
            if (/[\r\n]/.test(value)) throw new Error('TLS environment values must not contain newlines.');
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          console.log(`Prepared ${certificates.size} trusted CAs with eMudhra incident keys excluded`);
          NODE
      - name: List open pull requests
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_PR: ${{ inputs.pull-request || 0 }}
        run: |
          pulls=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open" \
            | jq --arg repo "$GITHUB_REPOSITORY" --argjson reviewed "$REVIEWED_PR" \
              '[.[] | select(.head.repo.full_name == $repo or .number == $reviewed) |
                {number, head: .head.sha, base: .base.sha}]' | jq -cs 'add // []')
          echo "pulls=$pulls" >> "$GITHUB_OUTPUT"

  compare:
    name: 'Compare PR #${{ matrix.pull.number }}'
    needs: pulls
    if: needs.pulls.outputs.open != '[]'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.pulls.outputs.open) }}
    steps:
      - *secure-tls
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.pull.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the merge base
        id: commits
        env:
          BASE: ${{ matrix.pull.base }}
          HEAD: ${{ matrix.pull.head }}
        # Keep the trusted base checked out; export reads the PR commit from Git.
        run: |
          git fetch --no-tags origin "$HEAD"
          echo "from=$(git merge-base "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"

      - uses: MrLesk/groma.md-action@v1.2.2
        id: map
        with:
          groma-version: '0.7.6'
          output: groma-comparison
          theme: ${{ env.GROMA_THEME }}
          from: ${{ steps.commits.outputs.from }}
          revision: ${{ matrix.pull.head }}

      - name: Place the comparison at /comparison/pr-<n>/
        env:
          NUMBER: ${{ matrix.pull.number }}
          MAP: ${{ steps.map.outputs.directory }}
        run: |
          mkdir -p "preview/comparison/pr-$NUMBER"
          mv "$MAP" "preview/comparison/pr-$NUMBER/$GROMA_THEME"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: groma-comparison-${{ matrix.pull.number }}
          path: preview
          retention-days: 1

  build:
    needs: [pulls, compare]
    # A failed comparison leaves out that pull request; the map still publishes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *secure-tls
      - uses: actions/checkout@v7.0.1

      - parallel:
          - name: Build the current architecture map
            uses: MrLesk/groma.md-action@v1.2.2
            with:
              groma-version: '0.7.6'
              output: ${{ runner.temp }}/groma-site
              theme: ${{ env.GROMA_THEME }}

          - name: Add the pull request comparisons
            if: needs.compare.result == 'success' || needs.compare.result == 'failure'
            uses: actions/download-artifact@v8.0.2
            with:
              pattern: groma-comparison-*
              merge-multiple: true
              path: ${{ runner.temp }}/groma-site

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/groma-site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.map-url.outputs.url }}
    steps:
      - *secure-tls
      - name: Publish architecture website
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Link to the architecture map
        id: map-url
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "url=${PAGE_URL%/}/architecture/$GROMA_THEME/" >> "$GITHUB_OUTPUT"

  # One comment per pull request, in the same format as the groma.md Action's own comment.
  comment:
    needs: [compare, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.compare.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - *secure-tls
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: groma-comparison-*
          merge-multiple: true
          path: previews

      - name: Update each pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          shopt -s nullglob
          marker='<!-- groma-comparison -->'
          for summary in previews/comparison/pr-*/"$GROMA_THEME"/comparison.json; do
            number=${summary#previews/comparison/pr-}
            number=${number%%/*}
            body=$(jq -r --arg marker "$marker" --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --arg url "${PAGE_URL%/}/comparison/pr-$number/$GROMA_THEME/" '
              def row($name; $count): "| \($name) | \($count.added) | \($count.modified) | \($count.removed) |";
              [$marker, "### Groma architecture comparison", "",
                "| Changes | Added | Modified | Removed |", "| --- | ---: | ---: | ---: |",
                row("Components"; .components), row("Relationships"; .relationships), "",
                "[Open before / after comparison](\($url)?revision=\(.revision)&from=\(.from))", "",
                "Compared [\(.from[0:7])](\($repo)/commit/\(.from)) (merge base) → [\(.revision[0:7])](\($repo)/commit/\(.revision))."]
              | join("\n")' "$summary")
            id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
            if [ -z "$id" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body" > /dev/null
            elif [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body)" != "$body" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
            fi
          done
